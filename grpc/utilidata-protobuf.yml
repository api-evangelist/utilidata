name: Karman data products — Protocol Buffers message schema
summary: >-
  Utilidata's Karman platform serializes its data products as Protocol Buffers and
  transports them over ZeroMQ. This is the machine-readable contract for the Karman
  Power Quality Analytics data product. Utilidata does not publish the .proto source
  file; what it publishes is the prost-build-generated Rust rendering of that .proto,
  saved verbatim in this directory. The manifest below is derived from that verbatim
  file — every field name, type, cardinality and tag number is read out of it.

x-caution: >-
  NO .proto FILE IS PUBLISHED BY UTILIDATA. This directory does not contain, and must
  not be represented as containing, a provider-authored .proto. It contains (a) the
  provider's own generated Rust, verbatim, and (b) this derived description of it.

