grpc_services: []
x-no-grpc-services: >-
  The published schema declares messages only — there are no `service` definitions, so
  this is a protobuf wire contract, not a gRPC API. Transport is ZeroMQ PUB/SUB
  (default endpoint tcp://<device>:5557, topic "cycle-aligned").

transport:
  protocol: zeromq
  pattern: pub-sub
  default_port: 5557
  topic: cycle-aligned
  live_endpoint_template: tcp://<KARMAN_DEVICE_IP>:5557
  replay_endpoint: tcp://data-replay.<namespace>.svc:5557
  serialization: protobuf
  note: >-
    Endpoints are on-premise / on-device. Utilidata publishes no hosted, internet-reachable
    API host for this surface.

