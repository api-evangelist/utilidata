aid: utilidata
name: Utilidata
description: 'Utilidata is an Ann Arbor, Michigan software company building Karman, a distributed
  AI platform that runs on a custom NVIDIA system-on-module embedded directly into electrical
  infrastructure — smart meters and grid-edge devices on the utility side, PDUs and power trays
  inside AI data centers. Karman processes high-resolution AC metrology locally (single-cycle
  waveform statistics at 1+ MS/s sample rates) to produce "data products" such as Power Quality
  Analytics, enabling millisecond-level power control, GPU/PSU failure prediction, phase
  balancing and power-aware scheduling. Utilidata publishes the Karman Power Aware Module as
  Apache-2.0 open source: a Rust reference implementation that serializes Karman data products
  as Protocol Buffers (package utilidata.karman.bibimbap.v1), transports them over ZeroMQ, and
  exposes them to Prometheus and TimescaleDB through a Helm-packaged Kubernetes stack. The
  company has raised a $100M Series C and counts NVIDIA, Microsoft Climate Innovation Fund,
  American Electric Power and Renown Capital Partners among its backers.'
