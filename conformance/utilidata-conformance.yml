summary: >-
  Utilidata's published surface conforms to a small set of infrastructure standards —
  proto3, the Prometheus text exposition format, ZeroMQ, Helm/Kubernetes — and to none of
  the API-description or API-security standards. There is no OpenAPI, no AsyncAPI, no
  GraphQL SDL, no OAuth, and no published compliance program.

